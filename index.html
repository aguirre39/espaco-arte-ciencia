<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espaço Arte-Ciência | Seminários e Psicologia Analítica</title>
  <meta name="description" content="Seminários, cursos, formação e Análise Junguiana no Espaço Arte-Ciência. Quatro décadas difundindo a visão de mundo de Carl Gustav Jung e Marie-Louise von Franz." />
  <meta http-equiv="refresh" content="0; url=./dist/" />
  <link rel="canonical" href="https://www.espacoarteciencia.com.br/" />
  <script>
    window.location.replace("./dist/");
  </script>
  <style>
    :root {
      --color-bg-primary: #FAF6F0;
      --color-brand-primary: #9E3E0E;
      --color-text-primary: #1C1917;
      --color-text-secondary: #443E38;
      --color-border: #E2D7C8;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .redirect-card {
      background-color: #FFFFFF;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(28, 25, 23, 0.08);
    }
    h1 {
      font-family: Georgia, serif;
      font-size: 1.5rem;
      margin: 0 0 0.75rem 0;
      color: var(--color-text-primary);
    }
    p {
      color: var(--color-text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 1.5rem 0;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      background-color: var(--color-brand-primary);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 6px;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background-color: #7C2F09;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <h1>Espaço Arte-Ciência</h1>
    <p>Carregando a página principal do Espaço Arte-Ciência...</p>
    <a href="./dist/" class="btn">Entrar no site</a>
  </div>
</body>
</html>
